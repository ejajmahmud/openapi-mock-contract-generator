[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-mock-contract-generator"
version = "0.1.0"
description = "Lightweight pure-Python mock server and contract assertion generator synthesized directly from OpenAPI 3.1 specifications"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
openapi-mock-contract-generator = "openapi_mock_contract_generator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openapi_mock_contract_generator*"]
